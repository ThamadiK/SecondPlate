<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get-togethers Near You | SecondPlate</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<header class="site-header">
    <a class="brand" href="/">
        <img th:src="@{/images/logo.png}" alt="">
        <span class="brand-name"><span class="brand-second">Second</span><span class="brand-plate">Plate</span></span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
        <a href="/host-event">Host an Event</a>
        <a href="#bookings">My Bookings</a>
        <a href="#friends">Friends</a>
    </nav>
    <label class="search-box">
        <span class="sr-only">Search</span>
        <input type="search" placeholder="Search">
        <span aria-hidden="true">⌕</span>
    </label>
    <button class="location" type="button"><img th:src="@{/images/location.png}" alt="">Melbourne</button>
    <button class="profile" type="button" aria-label="Open profile"><img th:src="@{/images/icon.png}" alt=""></button>
</header>

<h1 class="page-title">Get-togethers Near You</h1>

<div class="filters">
    <form method="get" th:action="@{/home}">
        <input type="text" name="cuisine" placeholder="Cuisine" th:value="${appliedCuisine}">
        <input type="text" name="dietary" placeholder="Dietary Needs" th:value="${appliedDietary}">
        <input type="text" name="timeOfDay" placeholder="Time of Day" th:value="${appliedTimeOfDay}">
        <select disabled><option>Recommended</option></select>
        <button type="submit">Apply</button>
        <a th:href="@{/home}">Clear filters</a>
    </form>

    <div style="margin-top: 10px;">
        <span class="chip" th:if="${appliedCuisine != null and !appliedCuisine.isBlank()}"
              th:text="${appliedCuisine}"></span>
        <span class="chip" th:if="${appliedDietary != null and !appliedDietary.isBlank()}"
              th:text="${appliedDietary}"></span>
    </div>
</div>

<div class="card-grid">
    <div class="card" th:each="event : ${events}">
        <img class="card-photo" th:if="${event.imageUrl != null}" th:src="@{${event.imageUrl}}" alt="">
        <div class="card-photo card-photo-placeholder" th:if="${event.imageUrl == null}"></div>
        <a class="card-title" th:href="@{'/events/' + ${event.eventId}}" th:text="${event.title}"></a>
    </div>
    <p th:if="${events.isEmpty()}">No events match those filters yet.</p>
</div>

</body>
</html>
