<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get-togethers Near You | SecondPlate</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>

<body>

<header class="site-header">
    <a class="brand" href="/">
        <img th:src="@{/images/logo.png}" alt="">
        <span class="brand-name"><span class="brand-second">Second</span><span class="brand-plate">Plate</span></span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
        <a href="/host-event">Host an Event</a>
        <a th:href="@{/my-bookings}">My Bookings</a>
        <a href="#friends">Friends</a>
    </nav>
    <label class="search-box">
        <span class="sr-only">Search</span>
        <input type="search" name="search" placeholder="Search" form="filterForm" th:value="${appliedSearch}">
        <span aria-hidden="true">⌕</span>
    </label>
    <label class="location">
        <img th:src="@{/images/location.png}" alt="">
        <select aria-label="Location">
            <option value="Melbourne">Melbourne</option>
            <option value="Sydney">Sydney</option>
            <option value="Brisbane">Brisbane</option>
            <option value="Perth">Perth</option>
        </select>
    </label>
    <button class="profile" type="button" aria-label="Open profile"><img th:src="@{/images/icon.png}" alt=""></button>
</header>

<h1 class="page-title">Get-togethers Near You</h1>

<div class="filters">
    <form method="get" th:action="@{/home}" id="filterForm">
        <input type="text" name="cuisine" placeholder="Cuisine" th:value="${appliedCuisine}">
        <input type="text" name="dietary" placeholder="Dietary Needs" th:value="${appliedDietary}">
        <input type="text" name="timeOfDay" placeholder="Time of Day" th:value="${appliedTimeOfDay}">
        <button type="submit">Apply</button>
        <a th:href="@{/home}">Clear filters</a>
    </form>

    <div style="margin-top: 10px;">
        <span class="chip" th:if="${appliedSearch != null and !appliedSearch.isBlank()}">
            <span th:text="'&quot;' + ${appliedSearch} + '&quot;'"></span>
            <a class="chip-remove" th:href="@{/home(cuisine=${appliedCuisine}, dietary=${appliedDietary}, timeOfDay=${appliedTimeOfDay})}">×</a>
        </span>
        <span class="chip" th:if="${appliedCuisine != null and !appliedCuisine.isBlank()}">
            <span th:text="${appliedCuisine}"></span>
            <a class="chip-remove" th:href="@{/home(search=${appliedSearch}, dietary=${appliedDietary}, timeOfDay=${appliedTimeOfDay})}">×</a>
        </span>
        <span class="chip" th:if="${appliedDietary != null and !appliedDietary.isBlank()}">
            <span th:text="${appliedDietary}"></span>
            <a class="chip-remove" th:href="@{/home(search=${appliedSearch}, cuisine=${appliedCuisine}, timeOfDay=${appliedTimeOfDay})}">×</a>
        </span>
        <span class="chip" th:if="${appliedTimeOfDay != null and !appliedTimeOfDay.isBlank()}">
            <span th:text="${appliedTimeOfDay}"></span>
            <a class="chip-remove" th:href="@{/home(search=${appliedSearch}, cuisine=${appliedCuisine}, dietary=${appliedDietary})}">×</a>
        </span>
    </div>
</div>

<div class="card-grid">
    <div class="card" th:each="event : ${events}">
        <img class="card-photo" th:if="${event.imageUrl != null}" th:src="@{${event.imageUrl}}" alt="">
        <div class="card-photo card-photo-placeholder" th:if="${event.imageUrl == null}"></div>
        <a class="card-title" th:href="@{'/events/' + ${event.eventId}}" th:text="${event.title}"></a>
    </div>
    <p th:if="${events.isEmpty()}">No events match those filters yet.</p>
</div>

<section class="groups-section">
    <div class="groups-header">
        <h2>Recurring Get-Together Groups</h2>
    </div>

    <div class="group-row" th:each="event : ${recurringEvents}">
        <div class="group-photo" th:if="${event.imageUrl != null}"
             th:style="'background-image: url(' + @{${event.imageUrl}} + ')'"></div>
        <div class="group-photo group-photo-placeholder" th:if="${event.imageUrl == null}"></div>

        <div class="group-info">
            <strong th:text="${event.title} + ' (' + ${bookingCounts.get(event.eventId)} + '/' + ${event.capacity} + ')'"></strong>
            <div class="group-time"
                 th:text="|${#temporals.format(event.eventDate, 'd MMM')}, ${#temporals.format(event.eventTime, 'HH:mm')}|"></div>
        </div>

        <a class="join-btn" th:href="@{'/events/' + ${event.eventId}}">Join Group</a>
    </div>

    <p th:if="${recurringEvents.isEmpty()}">No recurring groups yet.</p>
</section>

</body>
</html>
