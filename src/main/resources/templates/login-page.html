<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | SecondPlate</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-page">
    <aside class="auth-panel">
        <img class="brand-logo" th:src="@{/images/login-logo.png}" alt="">
        <p class="wordmark"><span class="second">Second</span><span class="plate">Plate</span></p>
    </aside>

    <section class="auth-form-side">
        <h1>Log In</h1>
        <p class="auth-success" th:if="${param.registered}">Account created log in to continue.</p>
        <p class="auth-error" th:if="${error}" th:text="${error}">Invalid username/email or password</p>
        <form class="auth-form" th:action="@{/login}" method="post">
            <input type="text" name="usernameOrEmail" th:value="${usernameOrEmail}" placeholder="Email or username" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button class="auth-submit" type="submit">Continue</button>
        </form>
        <p class="auth-footer">Dont have an account? <a th:href="@{/register}">Sign up</a></p>
    </section>
</div>
</body>
</html>
