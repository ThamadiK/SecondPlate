<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${eventType} + ' | SecondPlate'">Create Event | SecondPlate</title>
    <link rel="stylesheet" th:href="@{/css/host-event.css}">
</head>
<body>
<div th:replace="~{layout :: site-header('host')}"></div>

<main>
    <section class="page-hero">
        <h1>Host a Get Together</h1>
        <p>Enter details and get it together</p>
    </section>

    <form class="details-section" th:action="@{/host-event/details}" method="post">
        <input type="hidden" name="type" th:value="${recurring ? 'recurring' : 'one-time'}">
        <div class="form-column">
            <a class="back-link" href="/host-event">← Change event type</a>
            <p class="eyebrow" th:text="${eventType}">One-Time Event</p>
            <h2 th:text="${recurring ? 'Recurring Event Details' : 'One-Time Event Details'}">Event details</h2>
            <label>Event name <input type="text" name="title" placeholder="Give your event a name" required></label>
            <div th:if="${recurring}" class="recurring-fields">
                <label>Frequency
                    <select name="frequency" required>
                        <option value="WEEKLY">Weekly</option>
                        <option value="BIWEEKLY">Bi-weekly</option>
                        <option value="MONTHLY">Monthly</option>
                    </select>
                </label>
                <label>Start Date <input type="date" name="startDate" required></label>
            </div>
            <div th:unless="${recurring}" class="one-time-fields">
                <label>Time <input type="time" name="time" value="19:00" required></label>
                <label>Date <input type="date" name="date" required></label>
            </div>
            <label>Location <input type="text" name="location" placeholder="Where is it happening?" required></label>
            <label><span th:text="${recurring ? 'Group Capacity' : 'Capacity'}">Capacity</span>
                <input type="number" name="capacity" min="1" placeholder="How many people?" required>
            </label>
            <label>Set a price <input type="number" name="ticketPrice" min="0" step="0.01" placeholder="0.00"></label>
            <button class="create-button" type="submit">Create Get Together</button>
        </div>

        <div class="form-column side-column">
            <div>
                <h2>Enter Tags</h2>
                <div class="tags">
                    <button type="button">Vegan</button>
                    <button type="button">Soy</button>
                    <button type="button">Gluten free</button>
                    <button type="button">Indonesian Cuisine</button>
                    <button class="add-tag" type="button">+</button>
                </div>
            </div>
            <label>Description <textarea name="description" rows="6" placeholder="Tell people what to expect, including what's on the menu"></textarea></label>
            <label class="cover-label">Add a cover picture <input type="file" name="coverPicture" accept="image/png,image/jpeg"></label>
            <p class="recurring-hint" th:if="${recurring}">This event will repeat with the same group.</p>
        </div>
    </form>
</main>
</body>
</html>
