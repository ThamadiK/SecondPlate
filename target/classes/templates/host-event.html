<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host an Event | SecondPlate</title>
    <link rel="stylesheet" th:href="@{/css/host-event.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/"><img th:src="@{/images/logo.png}" alt="SecondPlate"></a>
    <nav class="main-nav" aria-label="Main navigation">
        <a class="active" href="/host-event">Host an Event</a>
        <a href="#bookings">My Bookings</a>
        <a href="#friends">Friends</a>
    </nav>
    <label class="search-box">
        <span class="sr-only">Search</span>
        <input type="search" placeholder="Search">
        <span aria-hidden="true">⌕</span>
    </label>
    <button class="location" type="button">⌖ Melbourne</button>
    <button class="profile" type="button" aria-label="Open profile">●</button>
</header>

<main>
    <section class="page-hero">
        <h1>Host a Get Together</h1>
        <p>Enter details and get it together</p>
    </section>

    <section class="choice-section">
        <h2>What type of get together are you hosting?</h2>
        <div class="choice-list">
            <a class="choice-card one-time" href="/host-event/details?type=one-time">
                <strong>One-Time Event</strong>
                <span>Organize a one-time get-together and meet new people.</span>
            </a>
            <a class="choice-card recurring" href="/host-event/details?type=recurring">
                <strong>Recurring Event</strong>
                <span>Meet with the same group and organize repeating events.</span>
            </a>
        </div>
    </section>
</main>
</body>
</html>
